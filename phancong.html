<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PHÂN CÔNG GSGK</title>
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

<style>
* { box-sizing: border-box; }
body { font-family: Arial, Helvetica, sans-serif; background: #f4f6fb; margin: 0; padding: 10px 10px; }
.container { max-width: 1500px; margin: auto; background: white; border-radius: 16px; padding: 10px; box-shadow: 0 12px 30px rgba(0,0,0,0.08); }

/* HEADER */
.header { display: flex; align-items: center; gap: 10px; margin-bottom: 5px; border-bottom: 2px solid #f0f0f0; padding-bottom: 5px; position: relative; }
.logo { height: 90px; object-fit: contain; }
.header-title-container { flex: 1; text-align: center; }
.title { font-size: 36px; font-weight: 700; color: #111827; margin: 0; }

.toolbar { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; margin-bottom: 5px; }

/* DROPDOWN LỌC THÁNG */
.month-select {
    padding: 5px 14px;
    border-radius: 8px;
    border: 1px solid #d7d7d7;
    font-size: 15px;
    font-weight: 700;
    color: #FF3333;
    outline: none;
    background-color: white;
    cursor: pointer;
    min-width: 150px;
}
.month-select:focus { border-color: #2563eb; }

.search-box { position: relative; flex: 1; min-width: 200px; }
.search-box input { width: 100%; padding: 10px 16px 5px 40px; border-radius: 8px; border: 1px solid #d7d7d7; font-size: 14px; outline: none; }
.search-box input:focus { border-color: #2563eb; }
.search-box .material-icons { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: #6b7280; }
.stats-card { display: flex; gap: 12px; }
.stat-item { background: #eff6ff; border: 1px solid #bfdbfe; padding: 5px 16px; border-radius: 8px; font-size: 14px; color: #1e40af; }
.btn-refresh { display: flex; align-items: center; gap: 6px; background: #2563eb; color: white; border: none; padding: 5px 16px; border-radius: 8px; font-size: 14px; font-weight: bold; cursor: pointer; }
.btn-refresh:hover { background: #1d4ed8; }

/* BẢNG DỮ LIỆU & TIÊU ĐỀ */
.table-wrapper { 
    overflow-x: auto; 
    max-height: 700px;
    border-radius: 10px; 
    border: 1px solid #e5e7eb; 
}
table { width: 100%; border-collapse: collapse; text-align: left; font-size: 13px; }

/* TIÊU ĐỀ BẢNG CHỮ ĐẬM */
th { 
    padding: 5px 8px; 
    text-align: center; 
    font-weight: 700; 
    border-bottom: 1px solid #e5e7eb; 
    position: sticky;
    top: 0;
    background: #3366FF;
    color: white;
    z-index: 10;
    white-space: nowrap;
}

/* TẤT CẢ HÀNG THÔNG TIN LÀ CHỮ THƯỜNG */
td { 
    padding: 3px; 
    border-bottom: 1px solid #e5e7eb; 
    vertical-align: middle; 
    font-weight: normal; 
    color: #374151;
}
tbody tr:hover { background-color: #f9fafb; }
.badge-clb { background: #dbeafe; color: #1e40af; padding: 4px 8px; border-radius: 6px; font-weight: normal; display: inline-block; }

/* ĐỘ RỘNG CỘT TỰ ĐỘNG PHÙ HỢP CÓ TẠO 2 DÒNG */
.col-person {
    max-width: 150px;
    min-width: 110px;
    white-space: normal;
    font-size: 12px;
    text-align: center;
    line-height: 1.4;
    padding: 6px 12px;
}

.person-name {
    display: block;
    font-weight: normal;
    color: #111827;
}

.phone-sub {
    display: block;
    font-size: 12px;
    color: #4b5563;
    font-weight: normal;
}

.loading, .no-data { text-align: center; padding: 40px 10px; color: #6b7280; }
@keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
</style>
</head>

<body>
<div class="container">
    <div class="header">
        <img src="Logo.jpg" alt="Logo" class="logo" onerror="this.style.display='none'">
        <div class="header-title-container">
            <h1 class="title">PHÂN CÔNG GSGK</h1>
        </div>
    </div>

    <div class="toolbar">
        <select id="monthFilter" class="month-select" onchange="filterData()">
            <option value="all">- Tất cả các tháng -</option>
            <option value="1">Tháng 1</option>
            <option value="2">Tháng 2</option>
            <option value="3">Tháng 3</option>
            <option value="4">Tháng 4</option>
            <option value="5">Tháng 5</option>
            <option value="6">Tháng 6</option>
            <option value="7">Tháng 7</option>
            <option value="8">Tháng 8</option>
            <option value="9">Tháng 9</option>
            <option value="10">Tháng 10</option>
            <option value="11">Tháng 11</option>
            <option value="12">Tháng 12</option>
        </select>

        <div class="search-box">
            <span class="material-icons">search</span>
            <input type="text" id="searchInput" placeholder="Tìm tên CLB, Giám sát, Giám khảo..." onkeyup="filterData()">
        </div>

        <div class="stats-card">
            <div class="stat-item">Tổng lượt phân công: <strong id="totalCount">0</strong></div>
        </div>

        <button class="btn-refresh" onclick="loadData()">
            <span class="material-icons">refresh</span> Tải lại
        </button>
    </div>

    <div class="table-wrapper">
        <table>
            <thead>
                <tr>
                    <th style="width: 30px;">STT</th>
                    <th style="width: 180px;">TÊN CLB</th>
                    <th>NGÀY THI</th>
                    <th>GIỜ THI</th>
                    <th>GIÁM SÁT</th>
                    <th>GIÁM KHẢO 1</th>
                    <th>GIÁM KHẢO 2</th>
                    <th>GIÁM KHẢO 3</th>
                    <th>GIÁM KHẢO 4</th>
                    <th>GIÁM KHẢO 5</th>
                    <th>THƯ KÝ VTF</th>
                </tr>
            </thead>
            <tbody id="tableBody">
                <tr>
                    <td colspan="11" class="loading">
                        <span class="material-icons" style="font-size: 32px; animation: spin 1s infinite linear;">sync</span>
                        <p>Đang tải dữ liệu...</p>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxV1wcisapayYm12jLfvKYIwQqJwn0yuGGJcZ28_U3RBqBgc0AhEw63pXhhmW0i94xr/exec"; 
let listAssignments = [];

function formatDate(dateVal) {
    if (!dateVal) return '';
    const str = String(dateVal).trim();
    
    if (/^\d{4}[-/]\d{1,2}[-/]\d{1,2}/.test(str)) {
        const parts = str.split('T')[0].split(/[-/]/);
        return `${parts[2].padStart(2, '0')}/${parts[1].padStart(2, '0')}/${parts[0]}`;
    }
    
    if (str.includes('/')) {
        const parts = str.split('/');
        if (parts.length >= 3) {
            return `${parts[0].padStart(2, '0')}/${parts[1].padStart(2, '0')}/${parts[2]}`;
        }
    }

    const d = new Date(str);
    if (!isNaN(d.getTime())) {
        const day = String(d.getDate()).padStart(2, '0');
        const month = String(d.getMonth() + 1).padStart(2, '0');
        return `${day}/${month}/${d.getFullYear()}`;
    }

    return str;
}

function formatTime(timeStr) {
    if (!timeStr) return '';
    const str = String(timeStr).trim();

    const timeMatch = str.match(/(\d{1,2}):(\d{2})/);
    if (timeMatch) {
        const hours = timeMatch[1].padStart(2, '0');
        const minutes = timeMatch[2];
        return `${hours}:${minutes}`;
    }

    return str;
}

/* HÀM XỬ LÝ CHỮ THƯỜNG VÀ TÁCH TÊN - SĐT THÀNH 2 DÒNG */
function formatPerson(text) {
    if (!text) return '';
    let str = String(text).trim();
    
    const phoneMatch = str.match(/(0\d{9,10})/);
    if (phoneMatch) {
        const phone = phoneMatch[0];
        // Loại bỏ số điện thoại và các ký tự '-' nối dư thừa
        let name = str.replace(phone, '').trim().replace(/[-–]$/, '').trim();
        return `<span class="person-name">${name}</span><span class="phone-sub">${phone}</span>`;
    }
    
    if (str.includes('\n')) {
        const parts = str.split('\n');
        return `<span class="person-name">${parts[0]}</span><span class="phone-sub">${parts.slice(1).join(' ')}</span>`;
    }

    return `<span class="person-name">${str}</span>`;
}

function getMonthFromDate(dateStr) {
    if (!dateStr) return 0;
    const formatted = formatDate(dateStr);
    if (formatted.includes('/')) {
        const parts = formatted.split('/');
        if (parts.length >= 2) return parseInt(parts[1], 10);
    }
    return 0;
}

async function loadData() {
    const tbody = document.getElementById("tableBody");
    tbody.innerHTML = `
        <tr>
            <td colspan="11" class="loading">
                <span class="material-icons" style="font-size: 32px; animation: spin 1s infinite linear;">sync</span>
                <p>Đang tải dữ liệu phân công...</p>
            </td>
        </tr>`;

    try {
        const response = await fetch(`${SCRIPT_URL}?action=getGSGK`);
        if (!response.ok) throw new Error("Không thể kết nối máy chủ.");

        const data = await response.json();

        if (Array.isArray(data)) {
            listAssignments = data.reverse();
        } else {
            listAssignments = [];
        }

        filterData();
    } catch (error) {
        console.error("Lỗi:", error);
        tbody.innerHTML = `<tr><td colspan="11" class="no-data" style="color: #ef4444;">Không thể tải dữ liệu. Vui lòng kiểm tra lại kết nối.</td></tr>`;
    }
}

function renderTable(data) {
    const tbody = document.getElementById("tableBody");
    tbody.innerHTML = "";

    if (!data || data.length === 0) {
        tbody.innerHTML = `<tr><td colspan="11" class="no-data">Chưa có dữ liệu phân công nào.</td></tr>`;
        document.getElementById("totalCount").innerText = "0";
        return;
    }

    data.forEach((item, index) => {
        const ngayThiFormatted = formatDate(item.ngay_thi);
        const gioThiFormatted = formatTime(item.gio_thi);

        const row = document.createElement("tr");
        row.innerHTML = `
            <td style="text-align: center;">${index + 1}</td>
            <td><span class="badge-clb">${item.ten_clb || ''}</span></td>
            <td style="text-align: center; white-space: nowrap;">${ngayThiFormatted}</td>
            <td style="text-align: center; white-space: nowrap;">${gioThiFormatted}</td>
            <td class="col-person">${formatPerson(item.giam_sat)}</td>
            <td class="col-person">${formatPerson(item.giam_khao_1)}</td>
            <td class="col-person">${formatPerson(item.giam_khao_2)}</td>
            <td class="col-person">${formatPerson(item.giam_khao_3)}</td>
            <td class="col-person">${formatPerson(item.giam_khao_4)}</td>
            <td class="col-person">${formatPerson(item.giam_khao_5)}</td>
            <td class="col-person">${formatPerson(item.thu_ky_vtf)}</td>
        `;
        tbody.appendChild(row);
    });

    document.getElementById("totalCount").innerText = data.length;
}

function filterData() {
    const selectedMonth = document.getElementById("monthFilter").value;
    const keyword = document.getElementById("searchInput").value.toLowerCase().trim();

    const filtered = listAssignments.filter(item => {
        let matchMonth = true;
        if (selectedMonth !== "all") {
            const itemMonth = getMonthFromDate(item.ngay_thi);
            matchMonth = (itemMonth === parseInt(selectedMonth, 10));
        }

        let matchKeyword = true;
        if (keyword) {
            const ngayFormatted = formatDate(item.ngay_thi).toLowerCase();
            matchKeyword = (item.ten_clb || "").toLowerCase().includes(keyword) ||
                           (item.giam_sat || "").toLowerCase().includes(keyword) ||
                           (item.giam_khao_1 || "").toLowerCase().includes(keyword) ||
                           (item.giam_khao_2 || "").toLowerCase().includes(keyword) ||
                           (item.giam_khao_3 || "").toLowerCase().includes(keyword) ||
                           (item.giam_khao_4 || "").toLowerCase().includes(keyword) ||
                           (item.giam_khao_5 || "").toLowerCase().includes(keyword) ||
                           (item.thu_ky_vtf || "").toLowerCase().includes(keyword) ||
                           ngayFormatted.includes(keyword);
        }

        return matchMonth && matchKeyword;
    });

    renderTable(filtered);
}

loadData();
</script>
</body>
</html>
